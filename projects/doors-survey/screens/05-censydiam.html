<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell 05 · Censydiam — Doors Survey</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link href="../assets/styles.css" rel="stylesheet">
</head>
<body>
<div id="screen"></div>

<template id="screen-content">

  <!-- Plain white landing (no panel/card treatment) per the supplied mobile
       design: left-aligned text blocks on mobile, centered image + CTA,
       centered text again from the md breakpoint up. All landing-only
       rules live under the .censydiam-landing scope in styles.css so they
       can't leak into 04-poll-predictor.html, which reuses the same
       data-state="landing" attribute. -->
  <section data-state="landing" class="censydiam-landing pt-4 pt-md-0">
    <div class="row">
      <div class="col-12 col-md-10 offset-md-1 col-lg-6 offset-lg-3 censydiam-landing__intro">
        <h2 class="censydiam-landing__heading censydiam-landing__heading--primary mb-3">More surveys are on the way &#127881;</h2>
        <p class="mb-1">We're looking for your next survey match.</p>
        <p class="mb-1">We'll let you know as soon as a one is ready.</p>
        <p class="mb-4">In the meantime, discover your hidden superpower with our fun personality quiz.</p>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12 text-center">
        <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/squad-home.webp" class="img-fluid censydiam-landing__image" alt="">
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-12 col-md-10 offset-md-1 col-lg-6 offset-lg-3 censydiam-landing__quiz">
        <h2 class="censydiam-landing__heading censydiam-landing__heading--secondary mb-3">Unleash Your Hidden Superpower &#9889;</h2>
        <p class="mb-1">Could your greatest strength be creativity, determination, or something unexpected?</p>
        <p class="mb-4">Take the quiz to uncover your inner superpower!</p>
        <div class="text-center">
          <button type="button" class="btn btn-primary btn-lg btn-cta btn-cta--center censydiam-landing__cta" id="startQuizBtn">Start Quiz!</button>
        </div>
      </div>
    </div>
  </section>

  <section data-state="choice" class="stage pt-4 pt-md-0 text-center" hidden>
    <h2 class="mb-2">What is your choice?</h2>
    <p class="mb-0">Choose the picture that best reflects what you value in life</p>

    <!-- Populated by initCensydiam() from CENSYDIAM_CHOICES below, so the
         (temporary) image paths are written in exactly one place. -->
    <div class="choice-grid" id="choiceGrid" role="radiogroup" aria-label="Choose an image"></div>

    <button type="button" class="btn btn-primary btn-lg btn-cta btn-cta--center" id="censydiamNextBtn" disabled>Next</button>
  </section>

  <!-- Result layout mirrors the reference's two-column grid (col-lg-5 image
       / col-lg-7 text) so the mascot image gets real room on desktop
       instead of being capped small — .img-fluid lets the grid column set
       its size instead of a fixed max-width. Mobile keeps the centered,
       stacked treatment from the supplied design.

       These 3 sections deliberately drop the `stage` class the other
       Doors Survey states use (which caps content at 760px, matching
       prepost-survey's .stage) — that cap was making this reveal panel
       look small next to the reference, which isn't width-constrained the
       same way. Dropped only here, only for the result panels: they fall
       back to .container-xl's own width (full width below ~1200px
       viewport, capped at 1140px above it). Every other cell/state keeps
       the 760px .stage system unchanged.

       Consolidated to the 3 approved outcomes (Cosmic Creativity / Magnetic
       Connectivity / Savvy Pragmatism) — the prior 8-result expansion is
       cancelled. State names (result-orange/result-yellow/result-black)
       are unchanged from the original 8-result implementation; only the
       content and the per-quality icon set changed. Each quality now has
       its own distinct icon, hosted under this project's own CDN folder
       (…/censydiam/doors-survey/) rather than reusing the reference's
       generic smile-wink/heart-circle-plus/comment-dots trio. -->
  <section data-state="result-orange" class="pt-4 pt-md-0" hidden>
    <div class="panel panel-results panel-results-orange">
      <div class="row align-items-center g-4">
        <div class="col-8 offset-2 col-lg-5 offset-lg-0 text-center text-lg-end">
          <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/monkey.webp" alt="" class="img-fluid">
        </div>
        <div class="col-12 col-lg-7 pe-lg-5 text-center text-lg-start">
          <p class="mb-1">Your superpower is&#8230;</p>
          <h1 class="mb-3">Cosmic Creativity</h1>
          <p>You see the world through a lens of endless possibilities. Your imagination and enthusiasm bring fresh ideas to life.</p>
          <ul class="list-unstyled pt-2 mt-4 text-start">
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-lightbulb.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Innovative</strong><p class="mb-0">You generate creative ideas that inspire new ways of thinking.</p></div>
            </li>
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-star.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Charismatic</strong><p class="mb-0">Your energy and playfulness make every interaction more engaging.</p></div>
            </li>
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-sun.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Positive</strong><p class="mb-0">You focus on possibilities and bring optimism wherever you go.</p></div>
            </li>
          </ul>
          <!-- Inert by design: no dashboard exists in this prototype. -->
          <button type="button" class="btn btn-primary btn-lg btn-cta">Go to Dashboard</button>
        </div>
      </div>
    </div>
  </section>

  <section data-state="result-black" class="pt-4 pt-md-0" hidden>
    <div class="panel panel-results panel-results-black">
      <div class="row align-items-center g-4">
        <div class="col-8 offset-2 col-lg-5 offset-lg-0 text-center text-lg-end">
          <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/dolphin.webp" alt="" class="img-fluid">
        </div>
        <div class="col-12 col-lg-7 pe-lg-5 text-center text-lg-start">
          <p class="mb-1">Your superpower is&#8230;</p>
          <h1 class="mb-3">Savvy Pragmatism</h1>
          <p>You bring structure and focus to everything you do. Your practical mindset helps you find smart solutions and keep things moving forward.</p>
          <ul class="list-unstyled pt-2 mt-4 text-start">
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-shield-check.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Reliable</strong><p class="mb-0">People can count on you to stay consistent and follow through.</p></div>
            </li>
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-chart-line.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Analytical</strong><p class="mb-0">You look at situations logically and make thoughtful decisions.</p></div>
            </li>
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-magnifying-glass-chart.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Insightful</strong><p class="mb-0">You notice important details and uncover meaningful patterns.</p></div>
            </li>
          </ul>
          <!-- Inert by design: no dashboard exists in this prototype. -->
          <button type="button" class="btn btn-primary btn-lg btn-cta">Go to Dashboard</button>
        </div>
      </div>
    </div>
  </section>

  <section data-state="result-yellow" class="pt-4 pt-md-0" hidden>
    <div class="panel panel-results panel-results-yellow">
      <div class="row align-items-center g-4">
        <div class="col-8 offset-2 col-lg-5 offset-lg-0 text-center text-lg-end">
          <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/panda.webp" alt="" class="img-fluid">
        </div>
        <div class="col-12 col-lg-7 pe-lg-5 text-center text-lg-start">
          <p class="mb-1">Your superpower is&#8230;</p>
          <h1 class="mb-3">Magnetic Connectivity</h1>
          <p>You make connections feel effortless. Your positive energy helps create strong relationships wherever you go.</p>
          <ul class="list-unstyled pt-2 mt-4 text-start">
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-seeding.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Optimistic</strong><p class="mb-0">You see possibilities in challenges and opportunities in change.</p></div>
            </li>
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-arrow-trend-up.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Uplifting</strong><p class="mb-0">Your positive attitude brightens interactions and inspires others.</p></div>
            </li>
            <li class="d-flex align-items-start pb-2 mb-4">
              <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/doors-survey/icon-censydiam-brain.svg" class="me-3" alt="" aria-hidden="true">
              <div><strong class="h5">Open-Minded</strong><p class="mb-0">You welcome different perspectives and enjoy learning from others.</p></div>
            </li>
          </ul>
          <!-- Inert by design: no dashboard exists in this prototype. -->
          <button type="button" class="btn btn-primary btn-lg btn-cta">Go to Dashboard</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Result switcher: lets a reviewer jump between the 3 approved
       Censydiam outcomes from the final result screen itself, styled as
       pills and switching state in place instead of navigating to a
       separate page. Pill labels reuse the reference's own short names for
       each outcome. Hidden by default; shown only once a result state is
       on screen (see showResult() below), so it never appears during
       landing/choice. -->
  <div class="result-switcher" id="resultSwitcher" hidden>
    <p class="result-switcher__label mb-2">Jump to another outcome</p>
    <div class="result-switcher__pills">
      <button type="button" class="result-pill" data-result-pill="result-orange">Creative</button>
      <button type="button" class="result-pill" data-result-pill="result-black">Pragmatist</button>
      <button type="button" class="result-pill" data-result-pill="result-yellow">Connector</button>
    </div>
  </div>

</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/partials.js"></script>
<script src="../assets/doors.js"></script>
<script>
  mountScreen({ footerLinks: true });

  const showState = initStates(document.getElementById('screen'), 'landing');
  document.getElementById('startQuizBtn').addEventListener('click', () => showState('choice'));

  // Wraps showState() so that, whenever a result state is displayed (either
  // via the real 2-choice flow or a pill click below), the result switcher
  // becomes visible and highlights the pill for the outcome now on screen.
  const resultSwitcher = document.getElementById('resultSwitcher');
  function showResult(name) {
    showState(name);
    resultSwitcher.hidden = false;
    resultSwitcher.querySelectorAll('[data-result-pill]').forEach(pill => {
      pill.classList.toggle('active', pill.dataset.resultPill === name);
    });
  }

  // Centralized choice -> result mapping. Two choices, matching astra's
  // own reference exactly (quiz_flow_01.astro has two <label class="choice-label">
  // options, not three). The reference itself reuses the same choice.webp
  // for every option (that's not something introduced here). The third
  // approved outcome (Magnetic Connectivity / result-yellow) isn't
  // reachable through the 2-choice flow, only via the result switcher's
  // pills — unchanged from the prior 8-result implementation.
  const CENSYDIAM_CHOICES = [
    { value: 'cosmic', label: 'Choice 1', image: 'https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/choice.webp', resultState: 'result-orange' },
    { value: 'savvy',  label: 'Choice 2', image: 'https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/censydiam/choice.webp', resultState: 'result-black' },
  ];

  initCensydiam({
    mapping: CENSYDIAM_CHOICES,
    choiceGrid: document.getElementById('choiceGrid'),
    nextButton: document.getElementById('censydiamNextBtn'),
    showState: showResult,
  });

  resultSwitcher.querySelectorAll('[data-result-pill]').forEach(pill => {
    pill.addEventListener('click', () => showResult(pill.dataset.resultPill));
  });
</script>
</body>
</html>
