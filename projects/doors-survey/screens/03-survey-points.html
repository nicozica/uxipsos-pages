<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell 03 · Survey &amp; Points — Doors Survey</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link href="../assets/styles.css" rel="stylesheet">
</head>
<body>
<div id="screen"></div>

<!-- Only two supplied states: Start and Exit. No intermediate questions are
     invented — "Next" on Start goes straight to Exit (see the audit: no
     reusable generic survey-question flow exists in any reference project,
     and none was supplied for this cell). -->
<template id="screen-content">

  <section data-state="start" class="stage pt-4 pt-md-0">
    <h2 class="mb-3">Let's hear what you think</h2>
    <p>Not every survey has to be serious. This one is all about everyday opinions, habits, and a few fun questions along the way.</p>
    <p>It will take approximately <i class="fa-regular fa-clock" aria-hidden="true"></i> <strong class="text-main">6 minutes</strong>, and you'll earn <i class="fa-solid fa-star text-warning" aria-hidden="true"></i> <strong class="text-main">50 points</strong> once you complete it.</p>
    <p class="mb-4">Ready to get started?</p>
    <button type="button" class="btn btn-primary btn-lg btn-cta" id="nextBtn">Next</button>
  </section>

  <section data-state="exit" class="stage pt-4 pt-md-0 text-center" hidden>
    <div class="celebrate mb-4">
      <img class="confetti" src="../images/effects/confetti.gif" aria-hidden="true" alt="">
      <h3 class="d-flex align-items-center justify-content-center gap-2 mb-3"><span class="badge-check">__CHECK_GREEN__</span> That's a Wrap!</h3>
      <p class="mb-0">Thanks for sharing your everyday opinions and having a little fun along the way.</p>
    </div>
    <div class="alert alert-success text-main mb-4">Your <i class="fa-solid fa-star text-warning" aria-hidden="true"></i> <strong>50 points</strong> have been awarded</div>
    <p>We'll let you know about new survey opportunities by email, and you can always check your dashboard for the latest surveys and activities available to you.</p>
    <p class="mb-4">We look forward to hearing from you again soon! &#128578;</p>
    <!-- Inert by design: no dashboard exists in this prototype. -->
    <button type="button" class="btn btn-primary btn-lg btn-cta">Go to Dashboard</button>
  </section>

</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/partials.js"></script>
<script src="../assets/doors.js"></script>
<script>
  const t = document.getElementById('screen-content');
  t.innerHTML = t.innerHTML.replace('__CHECK_GREEN__', ICON.checkGreen);

  mountScreen({ footerLinks: false });

  const showState = initStates(document.getElementById('screen'), 'start');
  document.getElementById('nextBtn').addEventListener('click', () => showState('exit'));
</script>
</body>
</html>
