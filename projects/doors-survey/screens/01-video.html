<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell 01 · Video — Doors Survey</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link href="../assets/styles.css" rel="stylesheet">
</head>
<body>
<div id="screen"></div>

<template id="screen-content">
  <div class="stage pt-4 pt-md-0">
    <h2 class="mb-3">More surveys are on the way &#127881;</h2>
    <p>Thanks for joining us! We're already on the lookout for your next survey match. It may take a little time, but new opportunities are always on the way. We'll let you know as soon as one is ready.</p>
    <p class="mb-4">Get ready to share your thoughts and earn rewards!</p>

    <h5 class="mb-3">See how Ipsos iSay works</h5>

    <!-- No real video asset exists yet for this cell (confirmed absent from
         every reference project and from the .fig source — see the audit).
         This is a static, visually-complete player presentation only: the
         poster image plus inert chrome. The play control is a real
         <button disabled> rather than a <video> with a missing source, so
         it can't throw a media error and reads correctly to screen readers
         as "unavailable" instead of silently doing nothing on activation. -->
    <div class="video-card mb-2">
      <img src="../images/video/video-poster.png" alt="Preview of the &quot;How Ipsos iSay works&quot; video">
      <button type="button" class="video-play-btn" disabled aria-label="Play video — not available in this prototype">
        <i class="fa-solid fa-play" aria-hidden="true"></i>
      </button>
      <div class="video-scrub" aria-hidden="true"><div class="video-scrub-fill"></div></div>
      <div class="video-controls-row" aria-hidden="true">
        <span>00:00 / 02:04</span>
        <span class="icons">
          <i class="fa-solid fa-volume-xmark"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-solid fa-expand"></i>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </span>
      </div>
    </div>
    <p class="text-center small mb-4">Get a quick introduction to how Ipsos iSay works and what you can expect as a member.</p>

    <p class="mb-4">
      &#128214; <strong class="text-main">Prefer reading?</strong><br>
      Read our
      <!-- Inert by design: no destination exists yet in this prototype. -->
      <button type="button" class="link-inert">quick guide</button>
      to getting started, earning rewards, and making the most of every survey opportunity.
    </p>

    <!-- Inert by design: no dashboard exists in this prototype. A real,
         enabled <button> is used (not an <a href="javascript:void(0)">)
         so it stays keyboard/focus accessible and visually matches the
         supplied design exactly, while doing nothing on activation. -->
    <button type="button" class="btn btn-primary btn-lg btn-cta">Go to Dashboard</button>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/partials.js"></script>
<script src="../assets/doors.js"></script>
<script>
  mountScreen({ footerLinks: false });
</script>
</body>
</html>
