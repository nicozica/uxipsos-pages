name: CI

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: [self-hosted, Linux, X64, ipsos-devops-01, opensuse, podman]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: podman build -f Containerfile -t localhost/uxipsos-pages-ci:${GITHUB_SHA} .

      - name: Smoke test
        run: |
          podman rm -f uxipsos-pages-ci >/dev/null 2>&1 || true
          podman run -d --name uxipsos-pages-ci -p 127.0.0.1:18083:80 localhost/uxipsos-pages-ci:${GITHUB_SHA}
          sleep 2
          curl --fail --silent http://127.0.0.1:18083/uxipsos-pages/_health >/dev/null
          podman rm -f uxipsos-pages-ci
          echo "Container smoke test passed"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish SHA image
        run: |
          podman tag \
            localhost/uxipsos-pages-ci:${GITHUB_SHA} \
            ghcr.io/iis-design/uxipsos-pages:${GITHUB_SHA}

          podman push \
            ghcr.io/iis-design/uxipsos-pages:${GITHUB_SHA}

          echo "Published ghcr.io/iis-design/uxipsos-pages:${GITHUB_SHA}"

      - name: Deploy main SHA
        if: github.ref == 'refs/heads/main'
        run: |
          ssh \
            -i /home/gha-runner/.ssh/id_ed25519_deploy \
            -o BatchMode=yes \
            nico@192.168.1.83 \
            "sudo -n /usr/local/bin/iis-deploy uxipsos-pages ${GITHUB_SHA}"

          podman tag \
            localhost/uxipsos-pages-ci:${GITHUB_SHA} \
            ghcr.io/iis-design/uxipsos-pages:main

          podman push \
            ghcr.io/iis-design/uxipsos-pages:main

          echo "UXIpsos Pages production deploy OK: ${GITHUB_SHA}"
